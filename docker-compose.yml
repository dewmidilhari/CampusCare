services:

  mongodb:
    image: mongo:7
    container_name: campuscare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - campuscare-mongodb-data:/data/db

  user-service:
    build:
      context: ./user-service
    container_name: campuscare-user-service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8081:8081"

  request-service:
    build:
      context: ./request-service
    container_name: campuscare-request-service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8082:8082"

  appointment-service:
    build:
      context: ./appointment-service
    container_name: campuscare-appointment-service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8080:8080"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: campuscare-api-gateway
    restart: unless-stopped
    depends_on:
      - user-service
      - request-service
      - appointment-service
    ports:
      - "8083:8083"

  client:
    build:
      context: ./client
    container_name: campuscare-client
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "5501:80"

volumes:
  campuscare-mongodb-data: