<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusCare - Appointment Service</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <h1>CampusCare</h1>

    <p>Appointment Service</p>

</header>



<main class="container">

    <h2>📅 Appointments</h2>

    <p class="welcome">
        Book and manage your appointments
    </p>



    <!-- ============================= -->
    <!-- CREATE APPOINTMENT -->
    <!-- ============================= -->

    <div class="appointment-card">

        <h3>Book New Appointment</h3>


        <label for="serviceType">
            Service Type
        </label>

        <select id="serviceType">

            <option value="">
                Select service type
            </option>

            <option value="ACADEMIC">
                Academic
            </option>

            <option value="IT_SUPPORT">
                IT Support
            </option>

            <option value="FACILITY">
                Facility
            </option>

            <option value="FINANCIAL">
                Financial
            </option>

            <option value="OTHER">
                Other
            </option>

        </select>



        <label for="appointmentTitle">
            Title
        </label>

        <input
            type="text"
            id="appointmentTitle"
            placeholder="Enter appointment title"
        >



        <label for="appointmentDescription">
            Description
        </label>

        <textarea
            id="appointmentDescription"
            placeholder="Enter appointment details"
        ></textarea>



        <label for="appointmentDate">
            Date
        </label>

        <input
            type="date"
            id="appointmentDate"
        >



        <label for="appointmentTime">
            Time
        </label>

        <input
            type="time"
            id="appointmentTime"
        >



        <button onclick="createAppointment()">

            Book Appointment

        </button>


        <p id="appointmentMessage"></p>

    </div>



    <!-- ============================= -->
    <!-- MY APPOINTMENTS -->
    <!-- ============================= -->

    <div class="appointment-card">

        <h3>My Appointments</h3>

        <div id="appointmentList">

            Loading appointments...

        </div>

    </div>



    <!-- ============================= -->
    <!-- BACK -->
    <!-- ============================= -->

    <div class="back-area">

        <button
            class="back-button"
            onclick="goToDashboard()">

            ← Back to Dashboard

        </button>

    </div>


</main>



<footer>

    <p>© 2026 CampusCare</p>

</footer>



<script src="app.js"></script>

</body>

</html>
