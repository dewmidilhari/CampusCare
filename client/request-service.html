```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusCare - Request Service</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <h1>CampusCare</h1>

    <p>Request Service</p>

</header>



<main class="login-container">

    <div class="login-card">


        <h2>📋 Service Requests</h2>

        <p class="login-text">
            Create and manage your service requests
        </p>



        <!-- CREATE REQUEST -->

        <h3>Create New Request</h3>


        <label for="requestType">
            Request Type
        </label>


        <select id="requestType">

            <option value="">
                Select request type
            </option>

            <option value="ACADEMIC">
                Academic
            </option>

            <option value="IT_SUPPORT">
                IT Support
            </option>

            <option value="FACILITY">
                Facility
            </option>

            <option value="FINANCIAL">
                Financial
            </option>

            <option value="OTHER">
                Other
            </option>

        </select>


        <br>
        <br>


        <label for="requestDescription">
            Description
        </label>


        <textarea
            id="requestDescription"
            rows="5"
            placeholder="Describe your request">
        </textarea>


        <br>
        <br>


        <button onclick="createRequest()">

            Submit Request

        </button>


        <p id="requestMessage"></p>



        <hr>



        <!-- MY REQUESTS -->

        <h3>My Requests</h3>


        <div id="requestList">

            Loading requests...

        </div>



        <br>


        <button onclick="goToDashboard()">

            ← Back to Dashboard

        </button>


    </div>

</main>



<footer>

    <p>© 2026 CampusCare</p>

</footer>



<script src="app.js"></script>


</body>

</html>
```
