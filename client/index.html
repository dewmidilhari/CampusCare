<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusCare - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>CampusCare</h1>
        <p>University Student Service Platform</p>
    </header>


    <main class="login-container">

        <div class="login-card">

            <h2>Student Login</h2>

            <p class="login-text">
                Login to access CampusCare services
            </p>


            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-text">
                Don't have an account?
                <button
                    type="button"
                    class="register-button"
                    onclick="register()">
                    Register
                </button>
            </p>

            <p id="message"></p>

        </div>

    </main>


    <footer>
        <p>© 2026 CampusCare</p>
    </footer>


    <script src="app.js"></script>

</body>

</html>
